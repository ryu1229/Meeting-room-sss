
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="회의실 예약"/>
<meta name="theme-color" content="#0F172A"/>
<title>회의실 예약</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#F1F5F9;min-height:100vh;}
button{cursor:pointer;font-family:inherit;transition:opacity .15s;}
button:hover{opacity:.8;}
input,select,textarea{font-family:inherit;}
input:focus,select:focus{outline:2px solid #0F172A;border-color:#0F172A!important;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px;}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── 설정 ──────────────────────────────────────────────────────────────────────
const ADMIN_PW = 'sam123sung';
const ACCESS_PW = 'sam123sung'; // 같은 비밀번호로 접속

const DEFAULT_ROOMS = [
  {id:'r1',name:'회의실 A',capacity:4, accent:'#3B82F6'},
  {id:'r2',name:'회의실 B',capacity:8, accent:'#8B5CF6'},
  {id:'r3',name:'회의실 C',capacity:12,accent:'#10B981'},
  {id:'r4',name:'회의실 D',capacity:6, accent:'#F59E0B'},
  {id:'r5',name:'회의실 E',capacity:20,accent:'#EF4444'},
  {id:'r6',name:'회의실 F',capacity:10,accent:'#06B6D4'},
];
const ACCENT_OPTS=['#3B82F6','#8B5CF6','#10B981','#F59E0B','#EF4444','#06B6D4','#EC4899','#F97316','#14B8A6','#6366F1','#84CC16','#64748B'];
const DAYS=['일','월','화','수','목','금','토'];
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const START_H=8,END_H=21,TOTAL_MIN=(END_H-START_H)*60,HOUR_PX=64;
const SLOTS=[];
for(let h=START_H;h<=END_H;h++){SLOTS.push(`${String(h).padStart(2,'0')}:00`);if(h<END_H)SLOTS.push(`${String(h).padStart(2,'0')}:30`);}

// ── 저장소 ────────────────────────────────────────────────────────────────────
function loadData(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch{return def;}}
function saveData(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

// ── 유틸 ──────────────────────────────────────────────────────────────────────
const toDateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const toTime=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const accentBg=hex=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},0.12)`;};
const overlaps=(a,b)=>a.date===b.date&&a.roomId===b.roomId&&toMin(a.startTime)<toMin(b.endTime)&&toMin(b.startTime)<toMin(a.endTime);

function getDaysInMonth(year,month){return new Date(year,month+1,0).getDate();}
function getFirstDayOfMonth(year,month){return new Date(year,month,1).getDay();}

// ── 상태 ──────────────────────────────────────────────────────────────────────
let state={
  // 인증
  accessGranted: loadData('mrb_access',false),
  isAdmin: false,

  // 데이터
  rooms: loadData('mrb_rooms', DEFAULT_ROOMS),
  reservations: loadData('mrb_res', []),

  // UI
  view: 'month',        // 'month' | 'week' | 'day'
  anchor: new Date(),
  selectedRoom: null,   // 월별 뷰에서 선택된 회의실
  modal: null,          // null | 'book' | 'settings' | 'detail'
  bookInit: {},
  detailRes: null,
  toast: null,

  // 비밀번호 입력
  pwInput: '',
  pwError: '',
  adminPwInput: '',
  adminPwError: '',
  showAdminLogin: false,
};

function setState(patch){
  Object.assign(state,typeof patch==='function'?patch(state):patch);
  render();
}

// ── 액션 ──────────────────────────────────────────────────────────────────────
function addReservation(b){
  const next=[...state.reservations,b];
  setState({reservations:next,modal:null});
  saveData('mrb_res',next);
  showToast(`✅ "${b.title}" 예약 완료`,'ok');
}
function deleteReservation(id,force=false){
  const res=state.reservations.find(r=>r.id===id);
  if(!res)return;
  if(!force&&!state.isAdmin){
    showToast('❌ 예약 취소는 관리자만 가능합니다.','err');
    return;
  }
  if(!confirm(`"${res.title}" 예약을 취소할까요?`))return;
  const next=state.reservations.filter(r=>r.id!==id);
  setState({reservations:next,modal:null,detailRes:null});
  saveData('mrb_res',next);
  showToast('🗑️ 예약이 취소되었습니다.','err');
}
function updateRooms(rooms){
  setState({rooms,modal:null});
  saveData('mrb_rooms',rooms);
  showToast('✅ 회의실 설정이 저장되었습니다.','ok');
}
function showToast(msg,type){
  setState({toast:{msg,type}});
  setTimeout(()=>setState({toast:null}),3000);
}

// ── DOM 헬퍼 ──────────────────────────────────────────────────────────────────
const el=(tag,attrs={},children=[])=>{
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')e.className=v;
    else if(k==='innerHTML')e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
};

function mkBtn(text,onclick,style={}){
  return el('button',{style:{padding:'10px 18px',borderRadius:'10px',fontSize:'13px',fontWeight:700,
    background:'#0F172A',color:'#fff',border:'none',...style},onClick:onclick},[text]);
}
function mkSecBtn(text,onclick,style={}){
  return mkBtn(text,onclick,{background:'#F1F5F9',color:'#475569',border:'1.5px solid #E2E8F0',...style});
}
function mkInput(attrs={}){
  return el('input',{style:{width:'100%',padding:'10px 12px',border:'1.5px solid #E2E8F0',
    borderRadius:'10px',fontSize:'14px',background:'#FAFAFA',boxSizing:'border-box'},...attrs});
}
function mkSelect(options,value,onchange,style={}){
  const s=el('select',{style:{width:'100%',padding:'10px 12px',border:'1.5px solid #E2E8F0',
    borderRadius:'10px',fontSize:'14px',background:'#FAFAFA',boxSizing:'border-box',...style},onChange:onchange});
  options.forEach(({v,label})=>{const o=el('option',{value:v},[label]);if(v===value)o.selected=true;s.appendChild(o);});
  return s;
}
function mkLabel(text){
  return el('div',{style:{fontSize:'12px',fontWeight:700,color:'#64748B',marginBottom:'5px',letterSpacing:'.04em'}},[text]);
}
function mkModal(title,content,mw=480){
  const box=el('div',{style:{background:'#fff',borderRadius:'20px',padding:'28px 28px',width:'100%',
    maxWidth:mw+'px',boxShadow:'0 32px 64px rgba(0,0,0,.2)',position:'relative',
    animation:'popIn .2s ease',maxHeight:'92vh',overflowY:'auto'}});
  const closeBtn=el('button',{style:{position:'absolute',top:'14px',right:'14px',background:'#F1F5F9',
    border:'none',borderRadius:'50%',width:'30px',height:'30px',fontSize:'16px',color:'#64748B',
    display:'flex',alignItems:'center',justifyContent:'center'}},['×']);
  closeBtn.addEventListener('click',()=>setState({modal:null,detailRes:null}));
  box.appendChild(closeBtn);
  if(title)box.appendChild(el('h3',{style:{margin:'0 0 20px',fontSize:'17px',fontWeight:800,color:'#0F172A'}},[title]));
  box.appendChild(content);
  const overlay=el('div',{style:{position:'fixed',inset:0,background:'rgba(15,23,42,.6)',display:'flex',
    alignItems:'center',justifyContent:'center',zIndex:900,backdropFilter:'blur(6px)',padding:'16px'}});
  overlay.addEventListener('click',()=>setState({modal:null,detailRes:null}));
  box.addEventListener('click',e=>e.stopPropagation());
  overlay.appendChild(box);
  return overlay;
}

// ── 접속 화면 ─────────────────────────────────────────────────────────────────
function renderAccessScreen(){
  const wrap=el('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',
    justifyContent:'center',background:'#F1F5F9',padding:'20px'}});
  const card=el('div',{style:{background:'#fff',borderRadius:'20px',padding:'40px 32px',
    width:'100%',maxWidth:'360px',boxShadow:'0 8px 32px rgba(0,0,0,.1)',textAlign:'center'}});

  card.appendChild(el('div',{style:{fontSize:'48px',marginBottom:'12px'}},['🏢']));
  card.appendChild(el('h1',{style:{fontSize:'20px',fontWeight:900,color:'#0F172A',marginBottom:'6px'}},['회의실 예약']));
  card.appendChild(el('p',{style:{fontSize:'13px',color:'#94A3B8',marginBottom:'28px'}},['비밀번호를 입력하세요']));

  const pwInp=el('input',{type:'password',placeholder:'비밀번호',
    style:{width:'100%',padding:'12px 14px',border:'1.5px solid #E2E8F0',borderRadius:'12px',
      fontSize:'15px',background:'#FAFAFA',boxSizing:'border-box',textAlign:'center',
      letterSpacing:'4px',marginBottom:'10px'}});
  pwInp.addEventListener('input',e=>state.pwInput=e.target.value);
  pwInp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryAccess(); });

  const errDiv=el('div',{style:{fontSize:'13px',color:'#EF4444',marginBottom:'12px',minHeight:'18px'}});

  function tryAccess(){
    if(state.pwInput===ACCESS_PW){
      saveData('mrb_access',true);
      setState({accessGranted:true,pwError:''});
    } else {
      errDiv.textContent='비밀번호가 틀렸습니다.';
      pwInp.value=''; state.pwInput='';
    }
  }

  const loginBtn=mkBtn('입장하기',tryAccess,{width:'100%',padding:'13px',fontSize:'15px'});

  card.appendChild(pwInp);
  card.appendChild(errDiv);
  card.appendChild(loginBtn);
  wrap.appendChild(card);
  return wrap;
}

// ── 예약 폼 ───────────────────────────────────────────────────────────────────
function renderBookingForm(initial={}){
  let f={
    roomId:   initial.roomId    || state.rooms[0]?.id||'',
    date:     initial.date      || toDateStr(new Date()),
    startTime:initial.startTime || '09:00',
    endTime:  initial.endTime   || '10:00',
    title:'', company:'', organizer:'', contact:'',
  };
  const errDiv=el('div',{style:{display:'none',padding:'9px 12px',background:'#FEF2F2',
    border:'1px solid #FCA5A5',borderRadius:'8px',fontSize:'13px',color:'#DC2626'}});
  function showErr(msg){errDiv.textContent=msg;errDiv.style.display='block';}

  const roomSel=mkSelect(state.rooms.map(r=>({v:r.id,label:`${r.name} (최대 ${r.capacity}명)`})),f.roomId,e=>f.roomId=e.target.value);
  const dateInp=mkInput({type:'date',value:f.date});
  dateInp.addEventListener('change',e=>f.date=e.target.value);

  const endOpts=()=>SLOTS.filter(t=>t>f.startTime).map(t=>({v:t,label:t}));
  const startSel=mkSelect(SLOTS.slice(0,-1).map(t=>({v:t,label:t})),f.startTime,e=>{
    f.startTime=e.target.value;
    if(f.endTime<=f.startTime){const nx=SLOTS[SLOTS.indexOf(f.startTime)+1];if(nx)f.endTime=nx;}
    while(endSel.firstChild)endSel.removeChild(endSel.firstChild);
    endOpts().forEach(({v,label})=>{const o=el('option',{value:v},[label]);if(v===f.endTime)o.selected=true;endSel.appendChild(o);});
  },{padding:'13px 14px',fontSize:'16px',fontWeight:'600'});
  const endSel=mkSelect(endOpts(),f.endTime,e=>f.endTime=e.target.value,{padding:'13px 14px',fontSize:'16px',fontWeight:'600'});

  const titleInp=mkInput({placeholder:'예: 주간 팀 미팅'});
  titleInp.addEventListener('input',e=>f.title=e.target.value);
  const companyInp=mkInput({placeholder:'예: OO 주식회사'});
  companyInp.addEventListener('input',e=>f.company=e.target.value);
  const orgInp=mkInput({placeholder:'예약자 이름'});
  orgInp.addEventListener('input',e=>f.organizer=e.target.value);
  const contactInp=mkInput({placeholder:'예: 010-1234-5678',type:'tel'});
  contactInp.addEventListener('input',e=>f.contact=e.target.value);

  return el('div',{style:{display:'flex',flexDirection:'column',gap:'13px'}},[
    el('div',{},[mkLabel('회의실'),roomSel]),
    el('div',{},[mkLabel('날짜'),dateInp]),
    el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}},[
      el('div',{},[mkLabel('시작 시간'),startSel]),
      el('div',{},[mkLabel('종료 시간'),endSel]),
    ]),
    el('div',{},[mkLabel('회의 제목'),titleInp]),
    el('div',{},[mkLabel('업체명'),companyInp]),
    el('div',{},[mkLabel('예약자'),orgInp]),
    el('div',{},[mkLabel('연락처'),contactInp]),
    errDiv,
    el('div',{style:{display:'flex',gap:'8px',marginTop:'4px'}},[
      mkSecBtn('취소',()=>setState({modal:null}),{flex:'1'}),
      mkBtn('예약 확정',()=>{
        f.roomId=roomSel.value; f.date=dateInp.value;
        if(!f.title.trim())return showErr('회의 제목을 입력하세요.');
        if(!f.organizer.trim())return showErr('예약자 이름을 입력하세요.');
        if(f.startTime>=f.endTime)return showErr('종료 시간이 시작 시간보다 늦어야 합니다.');
        const clash=state.reservations.find(r=>overlaps(r,f));
        if(clash)return showErr(`충돌: "${clash.title}" (${clash.startTime}–${clash.endTime})`);
        addReservation({...f,id:uid()});
      },{flex:'2'}),
    ]),
  ]);
}

// ── 예약 상세 모달 ─────────────────────────────────────────────────────────────
function renderDetailModal(res){
  const room=state.rooms.find(r=>r.id===res.roomId)||{name:'',accent:'#64748B'};
  const rows=[
    ['회의실',room.name],
    ['날짜',res.date],
    ['시간',`${res.startTime} – ${res.endTime}`],
    ['회의 제목',res.title],
    ['업체명',res.company||'—'],
    ['예약자',res.organizer],
    ['연락처',res.contact||'—'],
  ];
  const content=el('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});
  rows.forEach(([label,value])=>{
    content.appendChild(el('div',{style:{display:'flex',gap:'10px',padding:'8px 0',
      borderBottom:'1px solid #F1F5F9',alignItems:'center'}},[
      el('span',{style:{fontSize:'12px',fontWeight:700,color:'#94A3B8',width:'70px',flexShrink:0}},[label]),
      el('span',{style:{fontSize:'14px',color:'#0F172A',fontWeight:500}},[value]),
    ]));
  });
  if(state.isAdmin){
    content.appendChild(el('div',{style:{marginTop:'8px'}},[
      mkBtn('🗑️ 예약 취소 (관리자)',()=>deleteReservation(res.id,true),
        {width:'100%',background:'#FEF2F2',color:'#DC2626',border:'1.5px solid #FCA5A5'}),
    ]));
  }
  return content;
}

// ── 회의실 설정 ───────────────────────────────────────────────────────────────
function renderRoomSettings(){
  let list=state.rooms.map(r=>({...r}));
  const container=el('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'16px'}});
  const errDiv=el('div',{style:{display:'none',padding:'9px 12px',background:'#FEF2F2',
    borderRadius:'8px',fontSize:'13px',color:'#DC2626',marginBottom:'12px'}});

  function rebuild(){
    while(container.firstChild)container.removeChild(container.firstChild);
    list.forEach((r,i)=>{
      const nameInp=el('input',{value:r.name,placeholder:'회의실 이름',
        style:{padding:'7px 10px',border:'1.5px solid #E2E8F0',borderRadius:'8px',
          fontSize:'13px',background:'#fff',flex:'1',minWidth:0}});
      nameInp.addEventListener('input',e=>list[i].name=e.target.value);
      const capInp=el('input',{type:'number',value:r.capacity,min:'1',
        style:{padding:'7px 8px',border:'1.5px solid #E2E8F0',borderRadius:'8px',
          fontSize:'13px',background:'#fff',width:'64px',textAlign:'center'}});
      capInp.addEventListener('input',e=>list[i].capacity=Number(e.target.value));
      const colorBtn=el('div',{style:{width:'30px',height:'30px',borderRadius:'50%',background:r.accent,
        cursor:'pointer',flexShrink:0,border:`3px solid ${r._open?'#0F172A':'transparent'}`,boxSizing:'border-box'}});
      const colorPicker=el('div',{style:{display:r._open?'grid':'none',gridTemplateColumns:'repeat(4,1fr)',
        gap:'5px',position:'absolute',top:'38px',right:0,background:'#fff',borderRadius:'12px',
        padding:'10px',boxShadow:'0 8px 24px rgba(0,0,0,.15)',zIndex:10,width:'144px'}});
      ACCENT_OPTS.forEach(c=>{
        const dot=el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',background:c,cursor:'pointer',
          border:r.accent===c?'3px solid #0F172A':'3px solid transparent',boxSizing:'border-box'}});
        dot.addEventListener('click',()=>{list[i].accent=c;list[i]._open=false;rebuild();});
        colorPicker.appendChild(dot);
      });
      colorBtn.addEventListener('click',()=>{list[i]._open=!list[i]._open;rebuild();});
      const colorWrap=el('div',{style:{position:'relative',flexShrink:0}},[colorBtn,colorPicker]);
      const delBtn=el('button',{style:{width:'30px',height:'30px',background:'#FEF2F2',border:'none',
        borderRadius:'8px',color:'#EF4444',fontSize:'14px',flexShrink:0,
        display:'flex',alignItems:'center',justifyContent:'center'}},['✕']);
      delBtn.addEventListener('click',()=>{list.splice(i,1);rebuild();});
      container.appendChild(el('div',{style:{display:'flex',gap:'8px',alignItems:'center',
        padding:'10px 12px',background:'#F8FAFC',borderRadius:'12px',border:'1.5px solid #E2E8F0'}},
        [nameInp,capInp,colorWrap,delBtn]));
    });
  }
  rebuild();

  return el('div',{},[
    el('div',{style:{fontSize:'12px',color:'#94A3B8',marginBottom:'12px'}},['이름·수용 인원·색상을 변경하세요.']),
    container,
    el('div',{style:{fontSize:'11px',color:'#94A3B8',marginBottom:'10px'}},['이름 · 수용인원(명) · 색상']),
    errDiv,
    el('div',{style:{display:'flex',gap:'8px'}},[
      mkSecBtn('＋ 추가',()=>{list.push({id:uid(),name:'새 회의실',capacity:10,
        accent:ACCENT_OPTS[list.length%ACCENT_OPTS.length],_open:false});rebuild();},{flex:'1'}),
      mkBtn('저장',()=>{
        if(list.some(r=>!r.name.trim())){errDiv.textContent='이름을 입력하세요.';errDiv.style.display='block';return;}
        updateRooms(list.map(({_open,...r})=>r));
      },{flex:'1'}),
    ]),
  ]);
}

// ── 월별 뷰 ───────────────────────────────────────────────────────────────────
function renderMonthView(){
  const room = state.selectedRoom || state.rooms[0];
  if(!room) return el('div',{},[]);

  const year=state.anchor.getFullYear();
  const month=state.anchor.getMonth();
  const daysInMonth=getDaysInMonth(year,month);
  const firstDay=getFirstDayOfMonth(year,month);
  const today=toDateStr(new Date());

  // 회의실 탭
  const tabs=el('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px'}});
  state.rooms.forEach(r=>{
    const active=r.id===room.id;
    const tab=el('button',{style:{padding:'6px 14px',borderRadius:'99px',fontSize:'12px',fontWeight:700,
      border:`1.5px solid ${active?r.accent:'#E2E8F0'}`,
      background:active?accentBg(r.accent):'#fff',color:active?r.accent:'#64748B',cursor:'pointer'}},
      [r.name]);
    tab.addEventListener('click',()=>setState({selectedRoom:r}));
    tabs.appendChild(tab);
  });

  // 달력
  const cal=el('div',{style:{background:'#fff',borderRadius:'16px',overflow:'hidden',
    boxShadow:'0 2px 12px rgba(0,0,0,.06)'}});

  // 요일 헤더
  const hdrRow=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',
    background:'#F8FAFC',borderBottom:'1.5px solid #E2E8F0'}});
  DAYS.forEach((d,i)=>{
    hdrRow.appendChild(el('div',{style:{padding:'10px 4px',textAlign:'center',fontSize:'12px',
      fontWeight:700,color:i===0?'#EF4444':i===6?'#3B82F6':'#64748B'}},[d]));
  });
  cal.appendChild(hdrRow);

  // 날짜 그리드
  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}});
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;

  for(let i=0;i<totalCells;i++){
    const dayNum=i-firstDay+1;
    const isValid=dayNum>=1&&dayNum<=daysInMonth;
    const date=isValid?`${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`:'';
    const isToday=date===today;
    const dayOfWeek=i%7;
    const dayRes=isValid?state.reservations.filter(r=>r.date===date&&r.roomId===room.id):[];

    // 한달 예약 가능 여부 체크
    const targetDate=new Date(year,month,dayNum);
    const maxDate=addDays(new Date(),31);
    const isPast=isValid&&targetDate<new Date(new Date().setHours(0,0,0,0));
    const isFutureLimited=isValid&&targetDate>maxDate;

    const cell=el('div',{style:{
      minHeight:'80px',padding:'6px 4px',
      borderRight: i%7<6?'1px solid #F1F5F9':'none',
      borderBottom: i<totalCells-7?'1px solid #F1F5F9':'none',
      background: !isValid?'#F8FAFC':isPast?'#FAFAFA':'#fff',
      cursor: isValid&&!isPast&&!isFutureLimited?'pointer':'default',
      position:'relative',
    }});

    if(isValid){
      const numEl=el('div',{style:{
        width:'24px',height:'24px',borderRadius:'50%',display:'flex',
        alignItems:'center',justifyContent:'center',
        fontSize:'12px',fontWeight:isToday?800:500,marginBottom:'3px',
        background:isToday?'#0F172A':'transparent',
        color:isToday?'#fff':isPast?'#CBD5E1':dayOfWeek===0?'#EF4444':dayOfWeek===6?'#3B82F6':'#0F172A',
      }},[String(dayNum)]);
      cell.appendChild(numEl);

      // 예약 블록들
      dayRes.slice(0,2).forEach(res=>{
        const blk=el('div',{style:{background:accentBg(room.accent),borderLeft:`2px solid ${room.accent}`,
          borderRadius:'4px',padding:'2px 4px',marginBottom:'2px',cursor:'pointer',fontSize:'11px'}});
        blk.appendChild(el('div',{style:{fontWeight:700,color:room.accent,overflow:'hidden',
          whiteSpace:'nowrap',textOverflow:'ellipsis'}},[res.title]));
        blk.appendChild(el('div',{style:{color:'#64748B',fontSize:'10px'}},[`${res.startTime}–${res.endTime}`]));
        blk.addEventListener('click',e=>{e.stopPropagation();setState({modal:'detail',detailRes:res});});
        cell.appendChild(blk);
      });
      if(dayRes.length>2){
        cell.appendChild(el('div',{style:{fontSize:'10px',color:'#94A3B8',paddingLeft:'4px'}},
          [`+${dayRes.length-2}개 더`]));
      }

      if(!isPast&&!isFutureLimited){
        cell.addEventListener('click',()=>setState({modal:'book',bookInit:{roomId:room.id,date}}));
      }
    }
    grid.appendChild(cell);
  }
  cal.appendChild(grid);

  // 안내
  const note=el('div',{style:{padding:'8px 12px',background:'#F8FAFC',borderTop:'1px solid #F1F5F9',
    fontSize:'11px',color:'#94A3B8',textAlign:'center'}},
    ['날짜를 클릭하면 예약 · 예약 내용을 클릭하면 상세 보기 · 오늘부터 31일 이내 예약 가능']);

  return el('div',{},[tabs,cal,note]);
}

// ── 주별 뷰 ───────────────────────────────────────────────────────────────────
function renderWeekView(){
  const weekDates=[];
  const d=new Date(state.anchor),day=d.getDay();
  const mon=addDays(d,day===0?-6:1-day);
  for(let i=0;i<7;i++)weekDates.push(addDays(mon,i));
  const today=toDateStr(new Date());

  const wrap=el('div',{style:{overflowX:'auto'}});
  const inner=el('div',{style:{minWidth:state.rooms.length*100+70+'px'}});
  const hdr=el('div',{style:{display:'grid',gridTemplateColumns:'64px repeat(7,1fr)',
    border:'1.5px solid #E2E8F0',borderRadius:'12px 12px 0 0',overflow:'hidden'}});
  hdr.appendChild(el('div',{style:{background:'#F8FAFC',borderRight:'1px solid #E2E8F0'}}));
  weekDates.forEach((d,i)=>{
    const isToday=toDateStr(d)===today;
    const cell=el('div',{style:{padding:'10px 4px',textAlign:'center',
      background:isToday?'#0F172A':'#F8FAFC',borderRight:i<6?'1px solid #E2E8F0':'none'}});
    cell.appendChild(el('div',{style:{fontSize:'10px',color:'#94A3B8',marginBottom:'2px'}},[DAYS[d.getDay()]]));
    cell.appendChild(el('div',{style:{fontSize:'16px',fontWeight:800,color:isToday?'#fff':'#0F172A'}},[String(d.getDate())]));
    hdr.appendChild(cell);
  });
  inner.appendChild(hdr);
  state.rooms.forEach((room,ri)=>{
    const row=el('div',{style:{display:'grid',gridTemplateColumns:'64px repeat(7,1fr)',
      borderLeft:'1.5px solid #E2E8F0',borderRight:'1.5px solid #E2E8F0',
      borderBottom:ri===state.rooms.length-1?'1.5px solid #E2E8F0':'1px solid #E2E8F0',
      borderRadius:ri===state.rooms.length-1?'0 0 12px 12px':'0'}});
    const rc=el('div',{style:{padding:'8px 6px',borderRight:'1px solid #E2E8F0',background:accentBg(room.accent),
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'3px'}});
    rc.appendChild(el('div',{style:{width:'9px',height:'9px',borderRadius:'50%',background:room.accent}}));
    rc.appendChild(el('div',{style:{fontSize:'11px',fontWeight:700,color:room.accent,textAlign:'center',wordBreak:'break-all'}},[room.name]));
    rc.appendChild(el('div',{style:{fontSize:'10px',color:'#94A3B8'}},[room.capacity+'명']));
    row.appendChild(rc);
    weekDates.forEach((d,ci)=>{
      const ds=toDateStr(d);
      const cellRes=state.reservations.filter(r=>r.date===ds&&r.roomId===room.id);
      const cell=el('div',{style:{minHeight:'76px',padding:'4px',cursor:'pointer',
        borderRight:ci<6?'1px solid #F1F5F9':'none',background:'#fff'}});
      cell.addEventListener('click',()=>setState({modal:'book',bookInit:{roomId:room.id,date:ds}}));
      cellRes.forEach(res=>{
        const blk=el('div',{style:{background:accentBg(room.accent),borderLeft:`3px solid ${room.accent}`,
          borderRadius:'5px',padding:'3px 5px',marginBottom:'3px',cursor:'pointer'}});
        blk.appendChild(el('div',{style:{fontSize:'11px',fontWeight:700,color:room.accent,
          overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}},[res.title]));
        blk.appendChild(el('div',{style:{fontSize:'10px',color:'#64748B'}},[`${res.startTime}–${res.endTime}`]));
        blk.addEventListener('click',e=>{e.stopPropagation();setState({modal:'detail',detailRes:res});});
        cell.appendChild(blk);
      });
      row.appendChild(cell);
    });
    inner.appendChild(row);
  });
  wrap.appendChild(inner);
  return wrap;
}

// ── 일별 뷰 ───────────────────────────────────────────────────────────────────
let prevDayCleanup=null;
function renderDayView(){
  const dateStr=toDateStr(state.anchor);
  const dayRes=state.reservations.filter(r=>r.date===dateStr);
  const TOTAL_H=TOTAL_MIN/60*HOUR_PX;
  const wrap=el('div',{style:{display:'flex',background:'#fff'}});
  const gutter=el('div',{style:{width:'48px',flexShrink:0,borderRight:'1.5px solid #E2E8F0',
    background:'#F8FAFC',position:'relative',height:TOTAL_H+'px'}});
  for(let i=0;i<=END_H-START_H;i++){
    gutter.appendChild(el('div',{style:{position:'absolute',top:(i*HOUR_PX-8)+'px',left:0,right:0,
      padding:'0 6px 0 0',fontSize:'10px',color:'#94A3B8',textAlign:'right'}},
      [String(START_H+i).padStart(2,'0')+':00']));
  }
  wrap.appendChild(gutter);

  let dragState=null;
  if(prevDayCleanup){prevDayCleanup();prevDayCleanup=null;}

  state.rooms.forEach((room,ci)=>{
    const roomRes=dayRes.filter(r=>r.roomId===room.id);
    const col=el('div',{style:{flex:1,position:'relative',height:TOTAL_H+'px',
      borderRight:ci<state.rooms.length-1?'1px solid #F1F5F9':'none',
      cursor:'crosshair',userSelect:'none',minWidth:'72px'}});
    for(let i=0;i<END_H-START_H;i++){
      col.appendChild(el('div',{style:{position:'absolute',top:(i*HOUR_PX)+'px',left:0,right:0,
        borderTop:'1px solid #F1F5F9',pointerEvents:'none'}}));
    }
    function snapMin(y){
      const rect=col.getBoundingClientRect();
      return Math.round((Math.max(0,Math.min(1,(y-rect.top)/rect.height))*TOTAL_MIN+START_H*60)/30)*30;
    }
    const pctTop=min=>((min-START_H*60)/TOTAL_MIN*100).toFixed(3)+'%';
    const pctH=dm=>(dm/TOTAL_MIN*100).toFixed(3)+'%';

    const preview=el('div',{style:{position:'absolute',left:'3px',right:'3px',zIndex:3,
      pointerEvents:'none',display:'none',background:accentBg(room.accent),
      border:`2px dashed ${room.accent}`,borderRadius:'8px',
      alignItems:'center',justifyContent:'center'}});
    const previewLabel=el('span',{style:{fontSize:'11px',fontWeight:800,color:room.accent}});
    preview.appendChild(previewLabel);
    col.appendChild(preview);

    col.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      e.preventDefault();
      const sm=snapMin(e.clientY);
      dragState={roomId:room.id,startMin:sm,endMin:sm+30,col,preview,previewLabel};
      preview.style.display='flex';
      preview.style.top=pctTop(sm);
      preview.style.height=pctH(30);
      previewLabel.textContent=`${toTime(sm)} – ${toTime(sm+30)}`;
    });
    col.addEventListener('touchstart',e=>{
      const sm=snapMin(e.touches[0].clientY);
      dragState={roomId:room.id,startMin:sm,endMin:sm+30,col,preview,previewLabel};
      preview.style.display='flex';
    },{passive:true});

    roomRes.forEach(res=>{
      const blk=el('div',{style:{position:'absolute',left:'3px',right:'3px',zIndex:2,
        top:pctTop(toMin(res.startTime)),height:pctH(toMin(res.endTime)-toMin(res.startTime)),
        background:accentBg(room.accent),borderLeft:`3px solid ${room.accent}`,
        borderRadius:'6px',padding:'4px 6px',overflow:'hidden',cursor:'pointer',minHeight:'22px'}});
      blk.appendChild(el('div',{style:{fontSize:'11px',fontWeight:700,color:room.accent,
        whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},[res.title]));
      blk.appendChild(el('div',{style:{fontSize:'10px',color:'#64748B'}},[`${res.startTime}–${res.endTime}`]));
      blk.appendChild(el('div',{style:{fontSize:'10px',color:'#94A3B8'}},[res.organizer||(res.company||'')]));
      blk.addEventListener('click',e=>{e.stopPropagation();setState({modal:'detail',detailRes:res});});
      col.appendChild(blk);
    });
    wrap.appendChild(col);
  });

  function onMove(e){
    if(!dragState)return;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    const rect=dragState.col.getBoundingClientRect();
    let endMin=Math.round((Math.max(0,Math.min(1,(cy-rect.top)/rect.height))*TOTAL_MIN+START_H*60)/30)*30;
    if(endMin<=dragState.startMin)endMin=dragState.startMin+30;
    endMin=Math.min(endMin,END_H*60);
    dragState.endMin=endMin;
    dragState.preview.style.top=((dragState.startMin-START_H*60)/TOTAL_MIN*100).toFixed(3)+'%';
    dragState.preview.style.height=((endMin-dragState.startMin)/TOTAL_MIN*100).toFixed(3)+'%';
    dragState.previewLabel.textContent=`${toTime(dragState.startMin)} – ${toTime(endMin)}`;
  }
  function onUp(){
    if(!dragState)return;
    const{roomId,startMin,endMin}=dragState;
    dragState.preview.style.display='none';
    dragState=null;
    if(endMin-startMin>=30){
      setState({modal:'book',bookInit:{roomId,date:toDateStr(state.anchor),startTime:toTime(startMin),endTime:toTime(endMin)}});
    }
  }
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
  window.addEventListener('touchmove',onMove,{passive:true});
  window.addEventListener('touchend',onUp);
  prevDayCleanup=()=>{
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    window.removeEventListener('touchmove',onMove);
    window.removeEventListener('touchend',onUp);
  };
  return wrap;
}

// ── 메인 렌더 ─────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  while(app.firstChild)app.removeChild(app.firstChild);

  // 접속 화면
  if(!state.accessGranted){
    app.appendChild(renderAccessScreen());
    return;
  }

  const weekDates=[];
  {const d=new Date(state.anchor),day=d.getDay(),mon=addDays(d,day===0?-6:1-day);
   for(let i=0;i<7;i++)weekDates.push(addDays(mon,i));}

  const year=state.anchor.getFullYear(), month=state.anchor.getMonth();
  let hdr='';
  if(state.view==='month') hdr=`${year}년 ${MONTHS[month]}`;
  else if(state.view==='week') hdr=`${weekDates[0].getFullYear()}년 ${MONTHS[weekDates[0].getMonth()]} ${weekDates[0].getDate()}일 – ${MONTHS[weekDates[6].getMonth()]} ${weekDates[6].getDate()}일`;
  else hdr=`${year}년 ${MONTHS[month]} ${state.anchor.getDate()}일 (${DAYS[state.anchor.getDay()]})`;

  function navBtn(text,dir){
    return mkSecBtn(text,()=>{
      if(state.view==='month') setState({anchor:new Date(year,month+dir,1)});
      else if(state.view==='week') setState({anchor:addDays(state.anchor,dir*7)});
      else setState({anchor:addDays(state.anchor,dir)});
    },{padding:'7px 13px'});
  }
  function tabBtn(v,lbl){
    return mkBtn(lbl,()=>setState({view:v}),
      state.view===v?{padding:'7px 14px'}:{padding:'7px 14px',background:'#fff',color:'#475569',border:'1.5px solid #E2E8F0'});
  }

  // 캘린더 콘텐츠
  const calCard=el('div',{style:{background:state.view==='month'?'transparent':'#fff',
    borderRadius:'16px',boxShadow:state.view==='month'?'none':'0 2px 12px rgba(0,0,0,.06)',overflow:'hidden'}});

  if(state.view==='month'){
    calCard.appendChild(renderMonthView());
  } else if(state.view==='week'){
    calCard.appendChild(el('div',{style:{padding:'14px'}},[renderWeekView()]));
  } else {
    if(prevDayCleanup){prevDayCleanup();prevDayCleanup=null;}
    const colHdr=el('div',{style:{display:'flex',borderBottom:'1.5px solid #E2E8F0',
      background:'#fff',borderRadius:'16px 16px 0 0',overflow:'hidden'}});
    colHdr.appendChild(el('div',{style:{width:'48px',flexShrink:0,background:'#F8FAFC',borderRight:'1.5px solid #E2E8F0'}}));
    state.rooms.forEach((r,i)=>{
      colHdr.appendChild(el('div',{style:{flex:1,padding:'9px 4px',textAlign:'center',minWidth:'72px',
        background:accentBg(r.accent),borderRight:i<state.rooms.length-1?'1px solid #E2E8F0':'none'}},[
        el('div',{style:{fontSize:'11px',fontWeight:800,color:r.accent}},[r.name]),
        el('div',{style:{fontSize:'10px',color:'#94A3B8'}},['최대 '+r.capacity+'명']),
      ]));
    });
    const scrollWrap=el('div',{style:{overflowY:'auto',maxHeight:'580px',background:'#fff',
      borderRadius:'0 0 16px 16px',boxShadow:'0 2px 12px rgba(0,0,0,.06)'}});
    scrollWrap.appendChild(renderDayView());
    calCard.appendChild(colHdr);
    calCard.appendChild(scrollWrap);
    calCard.appendChild(el('div',{style:{padding:'8px',textAlign:'center',fontSize:'11px',
      color:'#94A3B8',borderTop:'1px solid #F1F5F9',background:'#fff'}},
      ['드래그로 시간 선택 · 블록 클릭으로 상세 보기']));
  }

  // 관리자 로그인 폼 (헤더 내)
  function renderAdminLoginInline(){
    if(state.isAdmin){
      return mkSecBtn('👑 관리자 로그아웃',()=>setState({isAdmin:false}),{fontSize:'11px',padding:'6px 12px',color:'#F59E0B',border:'1.5px solid #FDE68A',background:'#FFFBEB'});
    }
    if(!state.showAdminLogin){
      return mkSecBtn('관리자',()=>setState({showAdminLogin:true}),{fontSize:'11px',padding:'6px 12px'});
    }
    const inp=el('input',{type:'password',placeholder:'관리자 비밀번호',
      style:{padding:'6px 10px',border:'1.5px solid #E2E8F0',borderRadius:'8px',
        fontSize:'12px',background:'#FAFAFA',width:'140px'}});
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(inp.value===ADMIN_PW) setState({isAdmin:true,showAdminLogin:false});
        else{inp.value='';inp.style.borderColor='#EF4444';}
      }
      if(e.key==='Escape') setState({showAdminLogin:false});
    });
    const confirmBtn=mkBtn('확인',()=>{
      if(inp.value===ADMIN_PW) setState({isAdmin:true,showAdminLogin:false});
      else{inp.value='';inp.style.borderColor='#EF4444';}
    },{padding:'6px 10px',fontSize:'12px'});
    setTimeout(()=>inp.focus(),50);
    return el('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},[inp,confirmBtn]);
  }

  const root=el('div',{style:{minHeight:'100vh',background:'#F1F5F9',padding:'20px 16px'}},[
    el('div',{style:{maxWidth:'1300px',margin:'0 auto'}},[
      // 헤더
      el('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',
        marginBottom:'16px',flexWrap:'wrap',gap:'10px'}},[
        el('div',{},[
          el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},[
            el('h1',{style:{fontSize:'20px',fontWeight:900,color:'#0F172A',letterSpacing:'-.5px'}},['🏢 회의실 예약']),
            state.isAdmin?el('span',{style:{fontSize:'11px',fontWeight:700,color:'#F59E0B',
              background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:'99px',padding:'2px 8px'}},['👑 관리자']):el('span'),
          ]),
          el('p',{style:{fontSize:'11px',color:'#94A3B8',marginTop:'3px'}},['날짜 클릭으로 예약 · 예약 클릭으로 상세보기']),
        ]),
        el('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}},[
          renderAdminLoginInline(),
          state.isAdmin?mkSecBtn('⚙️ 회의실 설정',()=>setState({modal:'settings'}),{fontSize:'12px'}):el('span'),
          mkBtn('＋ 새 예약',()=>setState({modal:'book',bookInit:{}}),{fontSize:'12px'}),
        ]),
      ]),

      // 회의실 칩 (월별 외)
      state.view!=='month'?el('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'12px'}},
        state.rooms.map(r=>el('div',{style:{display:'flex',alignItems:'center',gap:'4px',padding:'4px 10px',
          background:accentBg(r.accent),borderRadius:'99px',border:`1px solid ${r.accent}40`}},[
          el('div',{style:{width:'7px',height:'7px',borderRadius:'50%',background:r.accent}}),
          el('span',{style:{fontSize:'11px',fontWeight:700,color:r.accent}},[r.name]),
          el('span',{style:{fontSize:'10px',color:'#94A3B8'}},['최대 '+r.capacity+'명']),
        ]))
      ):el('span'),

      // 툴바
      el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}},[
        el('div',{style:{display:'flex',gap:'4px'}},[
          navBtn('◀',-1),
          mkSecBtn('오늘',()=>setState({anchor:new Date()}),{padding:'7px 14px'}),
          navBtn('▶',1),
        ]),
        el('span',{style:{fontSize:'14px',fontWeight:800,color:'#0F172A',flex:1}},[hdr]),
        el('div',{style:{display:'flex',gap:'4px'}},[
          tabBtn('month','월'),
          tabBtn('week','주'),
          tabBtn('day','일'),
        ]),
      ]),

      calCard,
    ]),

    // 모달
    state.modal==='book'?mkModal('새 예약',renderBookingForm(state.bookInit)):
    state.modal==='settings'&&state.isAdmin?mkModal('⚙️ 회의실 설정',renderRoomSettings(),520):
    state.modal==='detail'&&state.detailRes?mkModal('예약 상세',renderDetailModal(state.detailRes)):
    el('span'),

    // 토스트
    state.toast?el('div',{style:{position:'fixed',bottom:'24px',right:'24px',zIndex:999,
      background:state.toast.type==='err'?'#FEF2F2':'#F0FDF4',
      border:`1px solid ${state.toast.type==='err'?'#FCA5A5':'#86EFAC'}`,
      color:state.toast.type==='err'?'#DC2626':'#16A34A',
      padding:'11px 18px',borderRadius:'12px',fontSize:'13px',fontWeight:700,
      boxShadow:'0 8px 24px rgba(0,0,0,.1)',animation:'slideUp .2s ease'}},
      [state.toast.msg]):el('span'),
  ]);

  app.appendChild(root);
}

render();
</script>
