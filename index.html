<style>

<body>
<div id="app"></div>
<script type="module">

import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkOLFFJsh0JwcEoUiyWbs58JiARnOyqHk",

  databaseURL: "https://meeting-room-81e08-default-rtdb.firebaseio.com",
  projectId: "meeting-room-81e08",

};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── 설정 ──────────────────────────────────────────────────────────────────────
const ADMIN_PW  = 'sam123sung';
const ACCESS_PW = 'tka123tjd';

const DEFAULT_ROOMS = [
  {id:'r1',name:'회의실 A',capacity:4, accent:'#3B82F6'},
  {id:'r2',name:'회의실 B',capacity:8, accent:'#8B5CF6'},
  {id:'r3',name:'회의실 C',capacity:12,accent:'#10B981'},
  {id:'r4',name:'회의실 D',capacity:6, accent:'#F59E0B'},
  {id:'r5',name:'회의실 E',capacity:20,accent:'#EF4444'},
  {id:'r6',name:'회의실 F',capacity:10,accent:'#06B6D4'},
];
const ACCENT_OPTS=['#3B82F6','#8B5CF6','#10B981','#F59E0B','#EF4444','#06B6D4','#EC4899','#F97316','#14B8A6','#6366F1','#84CC16','#64748B'];
const DAYS=['일','월','화','수','목','금','토'];
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const START_H=8,END_H=21,TOTAL_MIN=(END_H-START_H)*60,HOUR_PX=64;
const SLOTS=[];
for(let h=START_H;h<=END_H;h++){SLOTS.push(`${String(h).padStart(2,'0')}:00`);if(h<END_H)SLOTS.push(`${String(h).padStart(2,'0')}:30`);}

// ── 로컬 저장소 ───────────────────────────────────────────────────────────────
function loadLocal(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ── 유틸 ──────────────────────────────────────────────────────────────────────
const toDateStr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const toTime=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const accentBg=hex=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},0.12)`;};
const overlaps=(a,b,skipId=null)=>a.date===b.date&&a.roomId===b.roomId&&(skipId?a.id!==skipId:true)&&toMin(a.startTime)<toMin(b.endTime)&&toMin(b.startTime)<toMin(a.endTime);
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function getFirstDay(y,m){return new Date(y,m,1).getDay();}
function hashPw(pw){let h=0;for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0;}return String(h);}

// ── 상태 ──────────────────────────────────────────────────────────────────────
let S={
  accessGranted: loadLocal('mrb_access',false),
  isAdmin: false,
  rooms: DEFAULT_ROOMS,
  reservations: [],
  loaded: false,
  view: 'month',
  anchor: new Date(),
  selectedRoom: null,
  modal: null,       // null | 'book' | 'settings' | 'detail' | 'edit' | 'history' | 'pwcheck'
  bookInit: {},
  detailRes: null,
  editRes: null,
  pwCheckTarget: null,  // {res, action:'edit'|'cancel'}
  pwCheckInput: '',
  pwCheckError: '',
  toast: null,
  showAdminLogin: false,
};

function ss(patch){Object.assign(S,typeof patch==='function'?patch(S):patch);render();}

// ── Firebase ──────────────────────────────────────────────────────────────────
onValue(ref(db,'reservations'),snap=>{
  const val=snap.val();
  S.reservations=val?Object.values(val):[];
  S.loaded=true;
  render();
});
onValue(ref(db,'rooms'),snap=>{
  const val=snap.val();
  if(val)S.rooms=Array.isArray(val)?val:Object.values(val);
  render();
});
function fbSet(b){return set(ref(db,`reservations/${b.id}`),b);}
function fbDel(id){return remove(ref(db,`reservations/${id}`));}
function fbUpdate(id,data){return update(ref(db,`reservations/${id}`),data);}
function fbSaveRooms(rooms){return set(ref(db,'rooms'),rooms);}

// ── 액션 ──────────────────────────────────────────────────────────────────────
function addReservation(b){fbSet(b);ss({modal:null});showToast(`✅ "${b.title}" 예약 완료`,'ok');}
function deleteReservation(id,force=false){
  const res=S.reservations.find(r=>r.id===id);
  if(!res)return;
  if(!force&&!S.isAdmin){showToast('❌ 관리자만 강제 취소할 수 있습니다.','err');return;}
  if(!confirm(`"${res.title}" 예약을 취소할까요?`))return;
  fbDel(id);
  ss({modal:null,detailRes:null,pwCheckTarget:null});
  showToast('🗑️ 예약이 취소되었습니다.','err');
}
function editReservation(id,data){
  fbUpdate(id,data);
  ss({modal:null,editRes:null});
  showToast('✅ 예약이 수정되었습니다.','ok');
}
function updateRooms(rooms){fbSaveRooms(rooms);ss({modal:null});showToast('✅ 회의실 설정 저장','ok');}
function showToast(msg,type){ss({toast:{msg,type}});setTimeout(()=>ss({toast:null}),3000);}

// ── DOM 헬퍼 ──────────────────────────────────────────────────────────────────
const el=(tag,attrs={},children=[])=>{
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className')e.className=v;
    else e.setAttribute(k,v);
  });
  children.forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
};
function mkBtn(t,fn,s={}){return el('button',{style:{padding:'10px 18px',borderRadius:'10px',fontSize:'13px',fontWeight:700,background:'#0F172A',color:'#fff',border:'none',...s},onClick:fn},[t]);}
function mkSecBtn(t,fn,s={}){return mkBtn(t,fn,{background:'#F1F5F9',color:'#475569',border:'1.5px solid #E2E8F0',...s});}
function mkInp(a={}){return el('input',{style:{width:'100%',padding:'10px 12px',border:'1.5px solid #E2E8F0',borderRadius:'10px',fontSize:'14px',background:'#FAFAFA',boxSizing:'border-box'},...a});}
function mkSel(opts,val,fn,s={}){
  const e=el('select',{style:{width:'100%',padding:'10px 12px',border:'1.5px solid #E2E8F0',borderRadius:'10px',fontSize:'14px',background:'#FAFAFA',boxSizing:'border-box',...s},onChange:fn});
  opts.forEach(({v,label})=>{const o=el('option',{value:v},[label]);if(v===val)o.selected=true;e.appendChild(o);});
  return e;
}
function mkLbl(t){return el('div',{style:{fontSize:'12px',fontWeight:700,color:'#64748B',marginBottom:'5px',letterSpacing:'.04em'}},[t]);}
function mkModal(title,content,mw=480){
  const box=el('div',{style:{background:'#fff',borderRadius:'20px',padding:'28px',width:'100%',
    maxWidth:mw+'px',boxShadow:'0 32px 64px rgba(0,0,0,.2)',position:'relative',
    animation:'popIn .2s ease',maxHeight:'92vh',overflowY:'auto'}});
  const cb=el('button',{style:{position:'absolute',top:'14px',right:'14px',background:'#F1F5F9',border:'none',
    borderRadius:'50%',width:'30px',height:'30px',fontSize:'16px',color:'#64748B',
    display:'flex',alignItems:'center',justifyContent:'center'}},['×']);
  cb.addEventListener('click',()=>ss({modal:null,detailRes:null,editRes:null,pwCheckTarget:null}));
  box.appendChild(cb);
  if(title)box.appendChild(el('h3',{style:{margin:'0 0 20px',fontSize:'17px',fontWeight:800,color:'#0F172A'}},[title]));
  box.appendChild(content);
  const ov=el('div',{style:{position:'fixed',inset:0,background:'rgba(15,23,42,.6)',display:'flex',
    alignItems:'center',justifyContent:'center',zIndex:900,backdropFilter:'blur(6px)',padding:'16px'}});
  ov.addEventListener('click',()=>ss({modal:null,detailRes:null,editRes:null,pwCheckTarget:null}));
  box.addEventListener('click',e=>e.stopPropagation());
  ov.appendChild(box);
  return ov;
}
function row(label,value){
  return el('div',{style:{display:'flex',gap:'10px',padding:'9px 0',borderBottom:'1px solid #F1F5F9',alignItems:'flex-start'}},[
    el('span',{style:{fontSize:'12px',fontWeight:700,color:'#94A3B8',width:'70px',flexShrink:0,paddingTop:'1px'}},[label]),
    el('span',{style:{fontSize:'14px',color:'#0F172A',fontWeight:500,flex:1}},[value||'—']),
  ]);
}

// ── 접속 화면 ─────────────────────────────────────────────────────────────────
function renderAccessScreen(){
  const wrap=el('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F1F5F9',padding:'20px'}});
  const card=el('div',{style:{background:'#fff',borderRadius:'20px',padding:'40px 32px',width:'100%',maxWidth:'360px',boxShadow:'0 8px 32px rgba(0,0,0,.1)',textAlign:'center'}});
  card.appendChild(el('div',{style:{fontSize:'48px',marginBottom:'12px'}},['🏢']));
  card.appendChild(el('h1',{style:{fontSize:'20px',fontWeight:900,color:'#0F172A',marginBottom:'6px'}},['회의실 예약']));
  card.appendChild(el('p',{style:{fontSize:'13px',color:'#94A3B8',marginBottom:'28px'}},['비밀번호를 입력하세요']));
  const inp=el('input',{type:'password',placeholder:'비밀번호',
    style:{width:'100%',padding:'12px 14px',border:'1.5px solid #E2E8F0',borderRadius:'12px',
      fontSize:'15px',background:'#FAFAFA',boxSizing:'border-box',textAlign:'center',
      letterSpacing:'4px',marginBottom:'10px'}});
  const err=el('div',{style:{fontSize:'13px',color:'#EF4444',marginBottom:'12px',minHeight:'18px'}});
  function go(){if(inp.value===ACCESS_PW){saveLocal('mrb_access',true);ss({accessGranted:true});}else{err.textContent='비밀번호가 틀렸습니다.';inp.value='';}}
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  card.appendChild(inp);card.appendChild(err);
  card.appendChild(mkBtn('입장하기',go,{width:'100%',padding:'13px',fontSize:'15px'}));
  wrap.appendChild(card);return wrap;
}

// ── 비밀번호 확인 모달 (수정/취소 전) ────────────────────────────────────────
function renderPwCheck(){
  const{res,action}=S.pwCheckTarget;
  const room=S.rooms.find(r=>r.id===res.roomId)||{name:''};
  const actionLabel=action==='edit'?'수정':'취소';

  const inp=el('input',{type:'password',placeholder:'예약 시 설정한 비밀번호',
    style:{width:'100%',padding:'11px 12px',border:'1.5px solid #E2E8F0',borderRadius:'10px',
      fontSize:'14px',background:'#FAFAFA',boxSizing:'border-box',letterSpacing:'3px'}});
  const err=el('div',{style:{fontSize:'13px',color:'#EF4444',minHeight:'18px',marginTop:'6px'}});

  function confirm_pw(){
    if(hashPw(inp.value)===res.pwHash){
      if(action==='edit') ss({modal:'edit',editRes:res,pwCheckTarget:null});
      else deleteReservation(res.id,true);
    } else {
      err.textContent='비밀번호가 틀렸습니다.';
      inp.value='';
    }
  }
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')confirm_pw();});
  setTimeout(()=>inp.focus(),80);

  const content=el('div',{style:{display:'flex',flexDirection:'column',gap:'14px'}},[
    el('div',{style:{background:'#F8FAFC',borderRadius:'10px',padding:'12px 14px',fontSize:'13px',color:'#475569'}},[
      el('span',{style:{fontWeight:700,color:'#0F172A'}},[`"${res.title}"`]),
      ` 예약을 ${actionLabel}하려면 비밀번호를 입력하세요.`,
      el('div',{style:{fontSize:'12px',color:'#94A3B8',marginTop:'4px'}},[`${room.name} · ${res.date} · ${res.startTime}–${res.endTime}`]),
    ]),
    el('div',{},[inp,err]),
    el('div',{style:{display:'flex',gap:'8px'}},[
      mkSecBtn('취소',()=>ss({modal:S.detailRes?'detail':null,pwCheckTarget:null}),{flex:'1'}),
      mkBtn(`예약 ${actionLabel}`,confirm_pw,{flex:'2',
        background:action==='cancel'?'#EF4444':'#0F172A'}),
    ]),
  ]);
  return content;
}

// ── 예약 폼 (신규 + 수정 공용) ────────────────────────────────────────────────
function renderBookingForm(initial={}, isEdit=false){
  let f={
    roomId:   initial.roomId    || S.rooms[0]?.id||'',
    date:     initial.date      || toDateStr(new Date()),
    startTime:initial.startTime || '09:00',
    endTime:  initial.endTime   || '10:00',
    title:    initial.title     || '',
    company:  initial.company   || '',
    organizer:initial.organizer || '',
    contact:  initial.contact   || '',
    pw:       '',
    pwConfirm:'',
  };
  const errDiv=el('div',{style:{display:'none',padding:'9px 12px',background:'#FEF2F2',
    border:'1px solid #FCA5A5',borderRadius:'8px',fontSize:'13px',color:'#DC2626'}});
  function showErr(msg){errDiv.textContent=msg;errDiv.style.display='block';}

  const roomSel=mkSel(S.rooms.map(r=>({v:r.id,label:`${r.name} (최대 ${r.capacity}명)`})),f.roomId,e=>f.roomId=e.target.value);
  const dateInp=mkInp({type:'date',value:f.date});
  dateInp.addEventListener('change',e=>f.date=e.target.value);

  const endOpts=()=>SLOTS.filter(t=>t>f.startTime).map(t=>({v:t,label:t}));
  const startSel=mkSel(SLOTS.slice(0,-1).map(t=>({v:t,label:t})),f.startTime,e=>{
    f.startTime=e.target.value;
    if(f.endTime<=f.startTime){const nx=SLOTS[SLOTS.indexOf(f.startTime)+1];if(nx)f.endTime=nx;}
    while(endSel.firstChild)endSel.removeChild(endSel.firstChild);
    endOpts().forEach(({v,label})=>{const o=el('option',{value:v},[label]);if(v===f.endTime)o.selected=true;endSel.appendChild(o);});
  },{padding:'13px 14px',fontSize:'16px',fontWeight:'600'});
  const endSel=mkSel(endOpts(),f.endTime,e=>f.endTime=e.target.value,{padding:'13px 14px',fontSize:'16px',fontWeight:'600'});

  const titleInp=mkInp({placeholder:'예: 주간 팀 미팅',value:f.title});titleInp.addEventListener('input',e=>f.title=e.target.value);
  const companyInp=mkInp({placeholder:'예: OO 주식회사',value:f.company});companyInp.addEventListener('input',e=>f.company=e.target.value);
  const orgInp=mkInp({placeholder:'예약자 이름',value:f.organizer});orgInp.addEventListener('input',e=>f.organizer=e.target.value);
  const contactInp=mkInp({placeholder:'예: 010-1234-5678',type:'tel',value:f.contact});contactInp.addEventListener('input',e=>f.contact=e.target.value);
  const pwInp=mkInp({type:'password',placeholder:isEdit?'새 비밀번호 (변경 시에만 입력)':'예약 비밀번호 설정'});pwInp.addEventListener('input',e=>f.pw=e.target.value);
  const pwConfInp=mkInp({type:'password',placeholder:isEdit?'새 비밀번호 확인':'비밀번호 확인'});pwConfInp.addEventListener('input',e=>f.pwConfirm=e.target.value);

  function submit(){
    f.roomId=roomSel.value;f.date=dateInp.value;
    if(!f.title.trim())return showErr('회의 제목을 입력하세요.');
    if(!f.organizer.trim())return showErr('예약자 이름을 입력하세요.');
    if(f.startTime>=f.endTime)return showErr('종료 시간이 시작 시간보다 늦어야 합니다.');
    if(!isEdit&&!f.pw)return showErr('예약 비밀번호를 설정해 주세요.');
    if(f.pw&&f.pw!==f.pwConfirm)return showErr('비밀번호가 일치하지 않습니다.');

    if(isEdit){
      const clash=S.reservations.find(r=>overlaps(r,f,initial.id));
      if(clash)return showErr(`충돌: "${clash.title}" (${clash.startTime}–${clash.endTime})`);
      const data={roomId:f.roomId,date:f.date,startTime:f.startTime,endTime:f.endTime,
        title:f.title,company:f.company,organizer:f.organizer,contact:f.contact};
      if(f.pw)data.pwHash=hashPw(f.pw);
      editReservation(initial.id,data);
    } else {
      const clash=S.reservations.find(r=>overlaps(r,f));
      if(clash)return showErr(`충돌: "${clash.title}" (${clash.startTime}–${clash.endTime})`);
      addReservation({...f,id:uid(),pwHash:hashPw(f.pw),createdAt:Date.now()});
    }
  }

  const pwSection=el('div',{style:{background:'#F8FAFC',borderRadius:'12px',padding:'14px',
    display:'flex',flexDirection:'column',gap:'10px',border:'1.5px solid #E2E8F0'}},[
    el('div',{style:{fontSize:'12px',fontWeight:700,color:'#64748B',marginBottom:'2px'}},
      [isEdit?'🔒 비밀번호 변경 (선택사항)':'🔒 예약 비밀번호 설정']),
    el('div',{style:{fontSize:'11px',color:'#94A3B8',marginBottom:'4px'}},
      [isEdit?'비밀번호를 변경하려면 입력하세요.':'이 비밀번호로 나중에 예약을 수정·취소할 수 있어요.']),
    el('div',{},[mkLbl(isEdit?'새 비밀번호':'비밀번호'),pwInp]),
    el('div',{},[mkLbl('비밀번호 확인'),pwConfInp]),
  ]);

  return el('div',{style:{display:'flex',flexDirection:'column',gap:'13px'}},[
    el('div',{},[mkLbl('회의실'),roomSel]),
    el('div',{},[mkLbl('날짜'),dateInp]),
    el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}},[
      el('div',{},[mkLbl('시작 시간'),startSel]),
      el('div',{},[mkLbl('종료 시간'),endSel]),
    ]),
    el('div',{},[mkLbl('회의 제목'),titleInp]),
    el('div',{},[mkLbl('업체명'),companyInp]),
    el('div',{},[mkLbl('예약자'),orgInp]),
    el('div',{},[mkLbl('연락처'),contactInp]),
    pwSection,
    errDiv,
    el('div',{style:{display:'flex',gap:'8px',marginTop:'4px'}},[
      mkSecBtn('취소',()=>ss({modal:isEdit?'detail':null,editRes:null}),{flex:'1'}),
      mkBtn(isEdit?'수정 완료':'예약 확정',submit,{flex:'2'}),
    ]),
  ]);
}

// ── 예약 상세 ─────────────────────────────────────────────────────────────────
function renderDetail(res){
  const room=S.rooms.find(r=>r.id===res.roomId)||{name:'',accent:'#64748B'};
  const content=el('div',{style:{display:'flex',flexDirection:'column',gap:'0'}},[
    row('회의실',room.name), row('날짜',res.date),
    row('시간',`${res.startTime} – ${res.endTime}`),
    row('회의 제목',res.title), row('업체명',res.company),
    row('예약자',res.organizer), row('연락처',res.contact),
  ]);

  // 버튼 영역
  const btnWrap=el('div',{style:{display:'flex',gap:'8px',marginTop:'16px',flexWrap:'wrap'}});

  // 본인 수정/취소 버튼
  if(res.pwHash){
    btnWrap.appendChild(mkSecBtn('✏️ 수정',()=>ss({modal:'pwcheck',pwCheckTarget:{res,action:'edit'}}),
      {flex:'1',fontSize:'13px'}));
    btnWrap.appendChild(mkBtn('🗑️ 취소',()=>ss({modal:'pwcheck',pwCheckTarget:{res,action:'cancel'}}),
      {flex:'1',fontSize:'13px',background:'#FEF2F2',color:'#DC2626',border:'1.5px solid #FCA5A5'}));
  }

// ── 예약 이력 ─────────────────────────────────────────────────────────────────
function renderHistory(){
  const sorted=[...S.reservations].sort((a,b)=>{
    const da=a.date+a.startTime, db=b.date+b.startTime;
    return da>db?-1:da<db?1:0;
  });
  const today=toDateStr(new Date());
  const past=sorted.filter(r=>r.date<today||(r.date===today&&r.endTime<=new Date().toTimeString().slice(0,5)));
  const upcoming=sorted.filter(r=>!past.includes(r));

  function resCard(res){
    const room=S.rooms.find(r=>r.id===res.roomId)||{name:'?',accent:'#64748B'};
    const card=el('div',{style:{background:'#F8FAFC',borderRadius:'12px',padding:'12px 14px',
      border:'1.5px solid #E2E8F0',cursor:'pointer',transition:'background .15s'}});
    card.addEventListener('mouseenter',()=>card.style.background='#F1F5F9');
    card.addEventListener('mouseleave',()=>card.style.background='#F8FAFC');
    card.addEventListener('click',()=>ss({modal:'detail',detailRes:res}));
    card.appendChild(el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px'}},[
      el('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:room.accent,flexShrink:0}}),
      el('span',{style:{fontSize:'13px',fontWeight:700,color:'#0F172A',flex:1,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}},[res.title]),
      el('span',{style:{fontSize:'11px',color:'#94A3B8',flexShrink:0}},[res.date]),
    ]));
    card.appendChild(el('div',{style:{display:'flex',gap:'12px',fontSize:'12px',color:'#64748B'}},[
      el('span',{},[room.name]),
      el('span',{},[`${res.startTime}–${res.endTime}`]),
      el('span',{},[res.organizer]),
      res.company?el('span',{style:{color:'#94A3B8'}},[res.company]):el('span'),
    ]));
    return card;
  }

  function section(title,list,emptyMsg){
    const wrap=el('div',{style:{marginBottom:'20px'}});
    wrap.appendChild(el('div',{style:{fontSize:'13px',fontWeight:700,color:'#64748B',marginBottom:'10px',
      display:'flex',alignItems:'center',gap:'8px'}},[
      title,
      el('span',{style:{background:'#E2E8F0',borderRadius:'99px',padding:'1px 8px',fontSize:'11px',color:'#475569'}},[String(list.length)]),
    ]));
    if(list.length===0){
      wrap.appendChild(el('div',{style:{textAlign:'center',padding:'24px',color:'#94A3B8',fontSize:'13px',
        background:'#F8FAFC',borderRadius:'12px',border:'1.5px solid #E2E8F0'}},[emptyMsg]));
    } else {
      list.forEach(r=>wrap.appendChild(resCard(r)));
    }
    return wrap;
  }

  return el('div',{style:{display:'flex',flexDirection:'column',gap:'0'}},[
    section('📅 예정된 예약',upcoming,'예정된 예약이 없습니다.'),
    section('📋 지난 예약',past,'지난 예약 내역이 없습니다.'),
  ]);
}

// ── 월별 뷰 ───────────────────────────────────────────────────────────────────
function renderMonthView(){
  const room=S.selectedRoom||S.rooms[0];
  if(!room)return el('div');
  const year=S.anchor.getFullYear(),month=S.anchor.getMonth();
  const dim=getDaysInMonth(year,month),fd=getFirstDay(year,month);
  const today=toDateStr(new Date());
  const totalCells=Math.ceil((fd+dim)/7)*7;

  const tabs=el('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px'}});
  S.rooms.forEach(r=>{
    const active=r.id===room.id;
    const tab=el('button',{style:{padding:'6px 14px',borderRadius:'99px',fontSize:'12px',fontWeight:700,
      border:`1.5px solid ${active?r.accent:'#E2E8F0'}`,
      background:active?accentBg(r.accent):'#fff',color:active?r.accent:'#64748B',cursor:'pointer'}},[r.name]);
    tab.addEventListener('click',()=>ss({selectedRoom:r}));
    tabs.appendChild(tab);
  });

  const cal=el('div',{style:{background:'#fff',borderRadius:'16px',overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,.06)'}});
  const hdrRow=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#F8FAFC',borderBottom:'1.5px solid #E2E8F0'}});
  DAYS.forEach((d,i)=>hdrRow.appendChild(el('div',{style:{padding:'10px 4px',textAlign:'center',fontSize:'12px',fontWeight:700,color:i===0?'#EF4444':i===6?'#3B82F6':'#64748B'}},[d])));
  cal.appendChild(hdrRow);

  const grid=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}});
  for(let i=0;i<totalCells;i++){
    const dn=i-fd+1;
    const isV=dn>=1&&dn<=dim;
    const date=isV?`${year}-${String(month+1).padStart(2,'0')}-${String(dn).padStart(2,'0')}`:'';
    const isToday=date===today;
    const dow=i%7;
    const dayRes=isV?S.reservations.filter(r=>r.date===date&&r.roomId===room.id):[];
    const isPast=isV&&new Date(year,month,dn)<new Date(new Date().setHours(0,0,0,0));
    const isFar=isV&&new Date(year,month,dn)>addDays(new Date(),31);

    const cell=el('div',{style:{minHeight:'84px',padding:'6px 4px',
      borderRight:i%7<6?'1px solid #F1F5F9':'none',
      borderBottom:i<totalCells-7?'1px solid #F1F5F9':'none',
      background:!isV?'#F8FAFC':isPast?'#FAFAFA':'#fff',
      cursor:isV&&!isPast&&!isFar?'pointer':'default'}});

    if(isV){
      cell.appendChild(el('div',{style:{width:'24px',height:'24px',borderRadius:'50%',display:'flex',
        alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:isToday?800:500,
        marginBottom:'3px',background:isToday?'#0F172A':'transparent',
        color:isToday?'#fff':isPast?'#CBD5E1':dow===0?'#EF4444':dow===6?'#3B82F6':'#0F172A'}},[String(dn)]));
      dayRes.slice(0,2).forEach(res=>{
        const blk=el('div',{style:{background:accentBg(room.accent),borderLeft:`2px solid ${room.accent}`,
          borderRadius:'4px',padding:'2px 4px',marginBottom:'2px',cursor:'pointer'}});
        blk.appendChild(el('div',{style:{fontSize:'11px',fontWeight:700,color:room.accent,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}},[res.title]));
        blk.appendChild(el('div',{style:{fontSize:'10px',color:'#64748B'}},[`${res.startTime}–${res.endTime}`]));
        blk.addEventListener('click',e=>{e.stopPropagation();ss({modal:'detail',detailRes:res});});
        cell.appendChild(blk);
      });
      if(dayRes.length>2)cell.appendChild(el('div',{style:{fontSize:'10px',color:'#94A3B8',paddingLeft:'4px'}},[`+${dayRes.length-2}개 더`]));
      if(!isPast&&!isFar)cell.addEventListener('click',()=>ss({modal:'book',bookInit:{roomId:room.id,date}}));
    }
    grid.appendChild(cell);
  }
  cal.appendChild(grid);
  cal.appendChild(el('div',{style:{padding:'8px 12px',background:'#F8FAFC',borderTop:'1px solid #F1F5F9',fontSize:'11px',color:'#94A3B8',textAlign:'center'}},['날짜 클릭으로 예약 · 예약 클릭으로 상세보기 · 오늘부터 31일 이내 예약 가능']));
  return el('div',{},[tabs,cal]);
}

// ── 일별 뷰 ───────────────────────────────────────────────────────────────────
let prevDayCleanup=null;
function renderDayView(){
  const dateStr=toDateStr(S.anchor);
  const dayRes=S.reservations.filter(r=>r.date===dateStr);
  const TOTAL_H=TOTAL_MIN/60*HOUR_PX;
  const wrap=el('div',{style:{display:'flex',background:'#fff'}});
  const gutter=el('div',{style:{width:'48px',flexShrink:0,borderRight:'1.5px solid #E2E8F0',background:'#F8FAFC',position:'relative',height:TOTAL_H+'px'}});
  for(let i=0;i<=END_H-START_H;i++)gutter.appendChild(el('div',{style:{position:'absolute',top:(i*HOUR_PX-8)+'px',left:0,right:0,padding:'0 6px 0 0',fontSize:'10px',color:'#94A3B8',textAlign:'right'}},[String(START_H+i).padStart(2,'0')+':00']));
  wrap.appendChild(gutter);
  let dragState=null;
  if(prevDayCleanup){prevDayCleanup();prevDayCleanup=null;}
  S.rooms.forEach((room,ci)=>{
    const rr=dayRes.filter(r=>r.roomId===room.id);
    const col=el('div',{style:{flex:1,position:'relative',height:TOTAL_H+'px',borderRight:ci<S.rooms.length-1?'1px solid #F1F5F9':'none',cursor:'crosshair',userSelect:'none',minWidth:'72px'}});
    for(let i=0;i<END_H-START_H;i++)col.appendChild(el('div',{style:{position:'absolute',top:(i*HOUR_PX)+'px',left:0,right:0,borderTop:'1px solid #F1F5F9',pointerEvents:'none'}}));
    function snapMin(y){const rect=col.getBoundingClientRect();return Math.round((Math.max(0,Math.min(1,(y-rect.top)/rect.height))*TOTAL_MIN+START_H*60)/30)*30;}
    const pTop=min=>((min-START_H*60)/TOTAL_MIN*100).toFixed(3)+'%';
    const pH=dm=>(dm/TOTAL_MIN*100).toFixed(3)+'%';
    const prev=el('div',{style:{position:'absolute',left:'3px',right:'3px',zIndex:3,pointerEvents:'none',display:'none',background:accentBg(room.accent),border:`2px dashed ${room.accent}`,borderRadius:'8px',alignItems:'center',justifyContent:'center'}});
    const pl=el('span',{style:{fontSize:'11px',fontWeight:800,color:room.accent}});
    prev.appendChild(pl);col.appendChild(prev);
    col.addEventListener('mousedown',e=>{
      if(e.button!==0)return;e.preventDefault();
      const sm=snapMin(e.clientY);
      dragState={roomId:room.id,startMin:sm,endMin:sm+30,col,prev,pl};
      prev.style.display='flex';prev.style.top=pTop(sm);prev.style.height=pH(30);
      pl.textContent=`${toTime(sm)} – ${toTime(sm+30)}`;
    });
    rr.forEach(res=>{
      const blk=el('div',{style:{position:'absolute',left:'3px',right:'3px',zIndex:2,top:pTop(toMin(res.startTime)),height:pH(toMin(res.endTime)-toMin(res.startTime)),background:accentBg(room.accent),borderLeft:`3px solid ${room.accent}`,borderRadius:'6px',padding:'4px 6px',overflow:'hidden',cursor:'pointer',minHeight:'22px'}});
      blk.appendChild(el('div',{style:{fontSize:'11px',fontWeight:700,color:room.accent,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},[res.title]));
      blk.appendChild(el('div',{style:{fontSize:'10px',color:'#64748B'}},[`${res.startTime}–${res.endTime}`]));
      blk.appendChild(el('div',{style:{fontSize:'10px',color:'#94A3B8'}},[res.organizer||'']));
      blk.addEventListener('click',e=>{e.stopPropagation();ss({modal:'detail',detailRes:res});});
      col.appendChild(blk);
    });
    wrap.appendChild(col);
  });
  function onMove(e){
    if(!dragState)return;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    const rect=dragState.col.getBoundingClientRect();
    let em=Math.round((Math.max(0,Math.min(1,(cy-rect.top)/rect.height))*TOTAL_MIN+START_H*60)/30)*30;
    if(em<=dragState.startMin)em=dragState.startMin+30;
    em=Math.min(em,END_H*60);dragState.endMin=em;
    dragState.prev.style.top=((dragState.startMin-START_H*60)/TOTAL_MIN*100).toFixed(3)+'%';
    dragState.prev.style.height=((em-dragState.startMin)/TOTAL_MIN*100).toFixed(3)+'%';
    dragState.pl.textContent=`${toTime(dragState.startMin)} – ${toTime(em)}`;
  }
  function onUp(){
    if(!dragState)return;
    const{roomId,startMin,endMin}=dragState;
    dragState.prev.style.display='none';dragState=null;
    if(endMin-startMin>=30)ss({modal:'book',bookInit:{roomId,date:toDateStr(S.anchor),startTime:toTime(startMin),endTime:toTime(endMin)}});
  }
  window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
  window.addEventListener('touchmove',onMove,{passive:true});window.addEventListener('touchend',onUp);
  prevDayCleanup=()=>{window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);window.removeEventListener('touchmove',onMove);window.removeEventListener('touchend',onUp);};
  return wrap;
}

  const year=S.anchor.getFullYear(),month=S.anchor.getMonth();
  const d=new Date(S.anchor),day=d.getDay(),mon=addDays(d,day===0?-6:1-day);

  let hdr='';

  else if(S.view==='week')hdr=`${wd[0].getFullYear()}년 ${MONTHS[wd[0].getMonth()]} ${wd[0].getDate()}일 – ${MONTHS[wd[6].getMonth()]} ${wd[6].getDate()}일`;

    const inp=el('input',{type:'password',placeholder:'관리자 비밀번호',style:{padding:'6px 10px',border:'1.5px solid #E2E8F0',borderRadius:'8px',fontSize:'12px',background:'#FAFAFA',width:'140px'}});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){if(inp.value===ADMIN_PW)ss({isAdmin:true,showAdminLogin:false});else{inp.value='';inp.style.borderColor='#EF4444';}}if(e.key==='Escape')ss({showAdminLogin:false});});
    const ok=mkBtn('확인',()=>{if(inp.value===ADMIN_PW)ss({isAdmin:true,showAdminLogin:false});else{inp.value='';inp.style.borderColor='#EF4444';}},{padding:'6px 10px',fontSize:'12px'});
    setTimeout(()=>inp.focus(),50);
    return el('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},[inp,ok]);
  }

  const calCard=el('div',{style:{background:S.view==='month'?'transparent':'#fff',borderRadius:'16px',boxShadow:S.view==='month'?'none':'0 2px 12px rgba(0,0,0,.06)',overflow:'hidden'}});
  if(S.view==='month')calCard.appendChild(renderMonthView());
  else if(S.view==='week')calCard.appendChild(el('div',{style:{padding:'14px'}},[renderWeekView()]));
  else{
    if(prevDayCleanup){prevDayCleanup();prevDayCleanup=null;}
    const colHdr=el('div',{style:{display:'flex',borderBottom:'1.5px solid #E2E8F0',background:'#fff',borderRadius:'16px 16px 0 0',overflow:'hidden'}});
    colHdr.appendChild(el('div',{style:{width:'48px',flexShrink:0,background:'#F8FAFC',borderRight:'1.5px solid #E2E8F0'}}));
    S.rooms.forEach((r,i)=>colHdr.appendChild(el('div',{style:{flex:1,padding:'9px 4px',textAlign:'center',minWidth:'72px',background:accentBg(r.accent),borderRight:i<S.rooms.length-1?'1px solid #E2E8F0':'none'}},[el('div',{style:{fontSize:'11px',fontWeight:800,color:r.accent}},[r.name]),el('div',{style:{fontSize:'10px',color:'#94A3B8'}},['최대 '+r.capacity+'명'])])));
    const sw=el('div',{style:{overflowY:'auto',maxHeight:'580px',background:'#fff',borderRadius:'0 0 16px 16px',boxShadow:'0 2px 12px rgba(0,0,0,.06)'}});
    sw.appendChild(renderDayView());
    calCard.appendChild(colHdr);calCard.appendChild(sw);
  }

  // 모달 결정
  let modal=null;
  if(S.modal==='book')modal=mkModal('새 예약',renderBookingForm(S.bookInit,false));
  else if(S.modal==='edit'&&S.editRes)modal=mkModal('예약 수정',renderBookingForm(S.editRes,true));
  else if(S.modal==='settings'&&S.isAdmin)modal=mkModal('⚙️ 회의실 설정',renderRoomSettings(),520);
  else if(S.modal==='detail'&&S.detailRes)modal=mkModal('예약 상세',renderDetail(S.detailRes));
  else if(S.modal==='pwcheck'&&S.pwCheckTarget)modal=mkModal('본인 확인',renderPwCheck());
  else if(S.modal==='history')modal=mkModal('📋 예약 이력',renderHistory(),560);

  const root=el('div',{style:{minHeight:'100vh',background:'#F1F5F9',padding:'20px 16px'}},[
    el('div',{style:{maxWidth:'1300px',margin:'0 auto'}},[
      el('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'16px',flexWrap:'wrap',gap:'10px'}},[
        el('div',{},[
          el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},[
            el('h1',{style:{fontSize:'20px',fontWeight:900,color:'#0F172A',letterSpacing:'-.5px'}},['🏢 회의실 예약']),
            S.isAdmin?el('span',{style:{fontSize:'11px',fontWeight:700,color:'#F59E0B',background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:'99px',padding:'2px 8px'}},['👑 관리자']):el('span'),
          ]),
          el('p',{style:{fontSize:'11px',color:'#94A3B8',marginTop:'3px'}},['날짜 클릭으로 예약 · 예약 클릭으로 상세보기']),
        ]),
        el('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}},[
          renderAdminBtn(),
          S.isAdmin?mkSecBtn('⚙️ 설정',()=>ss({modal:'settings'}),{fontSize:'12px'}):el('span'),
          mkSecBtn('📋 이력',()=>ss({modal:'history'}),{fontSize:'12px'}),
          mkBtn('＋ 새 예약',()=>ss({modal:'book',bookInit:{}}),{fontSize:'12px'}),
        ]),
      ]),
      S.view!=='month'?el('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'12px'}},
        S.rooms.map(r=>el('div',{style:{display:'flex',alignItems:'center',gap:'4px',padding:'4px 10px',background:accentBg(r.accent),borderRadius:'99px',border:`1px solid ${r.accent}40`}},[
          el('div',{style:{width:'7px',height:'7px',borderRadius:'50%',background:r.accent}}),
          el('span',{style:{fontSize:'11px',fontWeight:700,color:r.accent}},[r.name]),
          el('span',{style:{fontSize:'10px',color:'#94A3B8'}},['최대 '+r.capacity+'명']),
        ]))):el('span'),
      el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}},[
        el('div',{style:{display:'flex',gap:'4px'}},[navBtn('◀',-1),mkSecBtn('오늘',()=>ss({anchor:new Date()}),{padding:'7px 14px'}),navBtn('▶',1)]),
        el('span',{style:{fontSize:'14px',fontWeight:800,color:'#0F172A',flex:1}},[hdr]),
        el('div',{style:{display:'flex',gap:'4px'}},[tabBtn('month','월'),tabBtn('week','주'),tabBtn('day','일')]),
      ]),
      calCard,
    ]),
    modal||el('span'),
    S.toast?el('div',{style:{position:'fixed',bottom:'24px',right:'24px',zIndex:999,
      background:S.toast.type==='err'?'#FEF2F2':'#F0FDF4',
      border:`1px solid ${S.toast.type==='err'?'#FCA5A5':'#86EFAC'}`,
      color:S.toast.type==='err'?'#DC2626':'#16A34A',
      padding:'11px 18px',borderRadius:'12px',fontSize:'13px',fontWeight:700,
      boxShadow:'0 8px 24px rgba(0,0,0,.1)',animation:'slideUp .2s ease'}},[S.toast.msg]):el('span'),
  ]);
  app.appendChild(root);
}

render();
</script>
</body>
</html>
